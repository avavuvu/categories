datasets:
  - table: languages
    type: csv_columns
    source: raw/ISO639-3/iso-639-3.tab
    delimiter: "\t"
    columns: {Ref_Name: name}

  - table: companies
    type: csv_columns
    source: raw/forbes/Forbes_2000_Companies_2025.csv
    delimiter: ";"
    columns: {Company: name}

  - table: bible_names
    type: json_array
    source: raw/bibleask/names.json
    array: names
    properties: [name]

  - table: oscars
    type: oscars
    source: raw/oscars/full_data.csv
    delimiter: "\t"

  - table: cities
    type: world_cities
    source: raw/simplemaps/worldcities.csv
    population_min: 100000

  - table: countries
    type: csv_columns
    source: "raw/mononoko/Mononoko's List of Things - Countries.tsv"
    delimiter: "\t"
    columns: {Country: name}

  - table: capitol
    type: csv_columns
    source: "raw/mononoko/Mononoko's List of Things - Countries.tsv"
    delimiter: "\t"
    columns: {"Capital(s)": name}

  - table: elements
    type: csv_columns
    source: "raw/mononoko/Mononoko's List of Things - Periodic Elements.tsv"
    delimiter: "\t"
    columns: {Name: name}

  - table: shakespeare_characters
    type: csv_columns
    source: "raw/mononoko/Mononoko's List of Things - Shakespear Characters.tsv"
    delimiter: "\t"
    columns: {Character: name}

  - table: us_presidents
    type: csv_columns
    source: "raw/mononoko/Mononoko's List of Things - US Presidents.tsv"
    delimiter: "\t"
    columns: {Name: name}

  - table: dictionary
    type: dictionary
    source: raw/dictionary/wordList.txt

  - table: us_states
    type: csv_columns
    source: "raw/mononoko/Mononoko's List of Things - US States.tsv"
    delimiter: "\t"
    skip_rows: 1
    columns: {State: name}
