    - label: personal names in the bible
      table: bible_names

    - label: US States
      table: us_states

    - label: herbs and spices
      table: herbs_and_spices
      facts: as defined by wikipedia

    - label: dairy products
      table: dairy_products
      facts: as defined by wikipedia

    - label: types of sandwich
      table: sandwiches
      facts: as defined by wikipedia

    - label: vegetables
      table: vegetables
